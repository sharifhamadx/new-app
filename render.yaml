services:
  - type: web
    name: aegea-smart-guide
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_PASSCODE
        sync: false
      - key: SUPPORT_WHATSAPP
        sync: false
      - key: SESSION_SECRET
        generateValue: true
