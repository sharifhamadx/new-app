name: Build Android APK (AEGEA)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend Render URL (e.g. https://aegea-smart-guide.onrender.com)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    name: Build AEGEA Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure preinstalled Android SDK & licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          mkdir -p "$SDK_DIR/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\ne6b7c2ab7fa2298c15165e9583d0acf0b04a2232" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_DIR/licenses/android-sdk-preview-license"
          printf "\nd975f751698a77b662f1254ddbeed3901e976f5a" > "$SDK_DIR/licenses/intel-android-extra-license"
          echo "Using preinstalled Android SDK at $SDK_DIR"

      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      - name: Resolve Backend API URL
        id: resolve_api
        env:
          INPUT_URL: ${{ github.event.inputs.api_base_url }}
          VAR_URL: ${{ vars.VITE_API_BASE_URL }}
          SECRET_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          API_URL="${INPUT_URL:-${VAR_URL:-${SECRET_URL:-}}}"
          API_URL="${API_URL%/}"
          if [ -z "$API_URL" ]; then
            echo "::warning::VITE_API_BASE_URL is not set in GitHub Variables or Secrets. Users can set their Render URL inside the app settings, or set VITE_API_BASE_URL in Repository Variables."
          else
            echo "Building APK against backend URL: $API_URL"
          fi
          echo "VITE_API_BASE_URL=$API_URL" >> $GITHUB_ENV

      - name: Build production web assets
        run: npm run build

      - name: Generate and configure Capacitor Android project
        env:
          CI: 'true'
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          node scripts/configure-android.mjs

      - name: Build installable Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename output APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AEGEA-Smart-Guide.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AEGEA-Smart-Guide-APK
          path: AEGEA-Smart-Guide.apk
          retention-days: 30

      - name: Publish downloadable GitHub Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.${{ github.run_number }}
          name: AEGEA Smart Guide APK v1.${{ github.run_number }}
          body: |
            Automated Android APK build for **AEGEA — Your Smart Guide** (Greek Hellenic Design, Email & Google Sign-In, Admin Subscriber Approval Dashboard, Live Camera & Voice Translator, and AI Travel Guide).
            Download `AEGEA-Smart-Guide.apk` below directly on your Android phone and tap to install.
          files: AEGEA-Smart-Guide.apk
